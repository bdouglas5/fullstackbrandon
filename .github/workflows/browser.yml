name: Verify browser portfolio
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm
      - run: npm ci
      - run: npm run test:browser
      - run: npm run build:browser
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config playwright.browser.config.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-portfolio-evidence
          path: |
            evidence/
            test-results/
