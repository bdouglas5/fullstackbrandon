# Create this service only after confirming the recurring compute and disk cost.
services:
  - type: web
    name: little-worlds
    runtime: node
    repo: https://github.com/bdouglas5/fullstackbrandon
    branch: main
    region: oregon
    plan: 0.5c-512mb
    numInstances: 1
    buildCommand: npm ci --include=dev && npm run build
    startCommand: PUBLIC_ORIGIN=${PUBLIC_ORIGIN:-$RENDER_EXTERNAL_URL} npm start
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    disk:
      name: world-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22.23.3
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_PATH
        value: /var/data/little-worlds.sqlite
      - key: MAX_ACTIVE_RUNS
        value: "30"
